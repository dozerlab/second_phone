<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#efecf6">
<title>My Phone</title>
<style>
:root{--ink:#26233a;--muted:#716c84;--accent:#7260a7;--line:#eae6f1;--paper:#faf9fd;--wall:linear-gradient(150deg,#dfe8ed 0%,#e9def0 42%,#c1c2e1 72%,#e5e2f2 100%)}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);background:#f4f2f6;font-family:system-ui,-apple-system,'Apple SD Gothic Neo',sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;border:0;background:none;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;padding:0}
svg{display:block;width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.page{min-height:100svh;display:flex;align-items:center;justify-content:center;gap:40px;padding:30px 24px;background:radial-gradient(ellipse at 80% 25%,#e8e2f2 0,transparent 45%)}
/* device */
.device{position:relative;width:374px;height:782px;border:7px solid #282631;border-radius:53px;background:#282631;box-shadow:0 35px 85px #30264024,0 4px 8px #30264020;flex:none}
.screen{position:relative;width:100%;height:100%;border-radius:45px;overflow:hidden;isolation:isolate;background:var(--wall);background-size:cover;background-position:center}
.island{position:absolute;z-index:50;top:13px;left:50%;transform:translateX(-50%);width:102px;height:27px;border-radius:20px;background:#211f28;pointer-events:none}
.statusbar{position:absolute;z-index:49;top:19px;left:24px;right:22px;display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:650;height:17px;pointer-events:none}
.statusbar.light{color:#fff}
.battery{height:10px;width:21px;border:1.4px solid currentColor;border-radius:3px;padding:1.2px;position:relative}
.battery:after{content:'';position:absolute;right:-3.5px;top:2px;height:3px;width:2px;background:currentColor;border-radius:1px}
.battery i{display:block;width:80%;height:100%;background:currentColor;border-radius:1px}
.status-r{display:flex;gap:6px;align-items:center}
.status-r svg{width:15px;height:15px}
.view{position:absolute;inset:0}
.view[hidden]{display:none}
.homebar{position:absolute;z-index:50;bottom:8px;left:50%;transform:translateX(-50%);width:120px;height:5px;border-radius:3px;background:currentColor;opacity:.85;cursor:pointer}
/* lock */
.lock{color:#fff;text-align:center;text-shadow:0 1px 8px #0003;cursor:pointer}
.lock .date{margin-top:78px;font-size:16px;font-weight:600}
.lock .time{font-size:84px;font-weight:300;letter-spacing:-3px;line-height:1.05}
.lock .hint{position:absolute;bottom:46px;left:0;right:0;font-size:12px;opacity:.9}
.lock .notif{position:absolute;left:14px;right:14px;top:330px;background:#ffffffd9;color:var(--ink);border-radius:18px;padding:11px 14px;text-align:left;font-size:12px;text-shadow:none;backdrop-filter:blur(14px)}
.lock .notif b{display:block;font-size:13px;margin-bottom:2px}
.pin{display:flex;flex-direction:column;align-items:center;padding-top:80px;color:#fff;background:#0000002e;backdrop-filter:blur(18px)}
.pin h3{font-size:15px;margin:20px 0 14px}
.dots{display:flex;gap:14px;margin-bottom:34px}
.dots i{width:11px;height:11px;border-radius:50%;border:1.5px solid #fff}
.dots i.on{background:#fff}
.dots.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}
.keys{display:grid;grid-template-columns:repeat(3,70px);gap:14px 20px}
.keys button{width:70px;height:70px;border-radius:50%;background:#ffffff38;font-size:28px;font-weight:300;line-height:1}
.keys button small{display:block;font-size:8px;letter-spacing:2px;margin-top:2px}
.keys button.t{background:none;font-size:14px;align-self:center}
/* home */
.home{padding:0;color:var(--ink);overflow:hidden}
.pages{display:flex;width:100%;height:100%;transition:transform .35s cubic-bezier(.2,.8,.2,1);touch-action:pan-y;user-select:none}
.pages.drag{transition:none}
.hpage{flex:none;width:100%;padding:62px 22px 0}
.pdots{position:absolute;left:0;right:0;bottom:116px;display:flex;justify-content:center;gap:8px}
.pdots i{width:7px;height:7px;border-radius:50%;background:#fff;opacity:.45;cursor:pointer;transition:opacity .2s}
.pdots i.on{opacity:1}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px 8px}
.app{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:10.5px;font-weight:500}
.icon{width:60px;height:60px;border-radius:22.5%;display:block;box-shadow:0 2px 6px #0002;position:relative}
.icon>svg,.icon>img{width:100%;height:100%;border-radius:inherit;display:block;stroke:none}
.icon>svg *{stroke-linecap:round;stroke-linejoin:round}
.toast{position:absolute;z-index:70;left:50%;bottom:120px;transform:translateX(-50%);background:#000a;color:#fff;font-size:12px;padding:8px 14px;border-radius:16px;white-space:nowrap;animation:pop .25s ease}
.badge{position:absolute;top:-5px;right:-5px;background:#ff3b30;color:#fff;font-size:11px;min-width:19px;height:19px;border-radius:10px;display:grid;place-items:center;font-weight:600}
.screen.photo .home .app{color:#fff;text-shadow:0 1px 4px #0007}
.dock{position:absolute;left:12px;right:12px;bottom:24px;height:84px;border-radius:30px;background:#ffffff59;backdrop-filter:blur(16px);display:flex;justify-content:space-around;align-items:center;padding:0 8px}
/* apps */
.appview{background:var(--paper);display:flex;flex-direction:column;padding-top:56px}
.appbar{display:flex;align-items:center;justify-content:space-between;padding:6px 14px 10px;min-height:44px}
.appbar h2{margin:0;font-size:17px}
.back{color:var(--accent);font-size:15px;display:flex;align-items:center;gap:2px;min-width:60px}
.back svg{width:20px;height:20px}
.body{flex:1;overflow:auto;padding:0 16px 40px}
.body::-webkit-scrollbar{display:none}
.row{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center;width:100%;text-align:left}
.av{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#c1c2e1,#e9def0);display:grid;place-items:center;font-weight:600;color:var(--accent);flex:none}
.row .t{flex:1;min-width:0}.row b{font-size:14px}.row p{margin:2px 0 0;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.compose{display:flex;gap:8px;padding:8px 14px 26px;border-top:1px solid var(--line)}
.compose input,.noteed textarea,.noteed input{flex:1;border:1px solid var(--line);border-radius:18px;padding:9px 14px;font:inherit;font-size:14px;outline:0;background:#fff}
.compose button{background:var(--accent);color:#fff;border-radius:18px;padding:0 14px;font-size:13px}
.big{position:absolute;inset:0;z-index:60;background:#000e;display:grid;place-items:center}.big img{max-width:100%;max-height:100%}
.noteed{display:flex;flex-direction:column;gap:10px;height:100%}.noteed textarea{border-radius:14px;flex:1;resize:none}
.appview.grouped{background:#f2f2f7}
.group{background:#fff;border-radius:20px;margin:0 0 26px;overflow:hidden}
.group-h{font-size:12px;color:#8e8e93;margin:0 0 6px 14px;text-transform:uppercase}
.srow{display:flex;align-items:center;gap:12px;padding:0 14px;min-height:50px;font-size:16px;width:100%;text-align:left;background:none;position:relative}
.srow+.srow:before{content:'';position:absolute;top:0;left:55px;right:0;height:1px;background:#e6e6ea}
.srow.noico+.srow:before,.srow+.srow.noico:before{left:14px}
.sico{width:29px;height:29px;border-radius:22.5%;display:block;flex:none;overflow:hidden}
.sico img{width:100%;height:100%;display:block}
.srow .val{margin-left:auto;color:#8e8e93;font-size:16px;max-width:55%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .chev{width:14px;height:14px;stroke:#c4c4c8;stroke-width:2.2;flex:none}
.srow .chev{margin-left:auto}
.srow .val+.chev{margin-left:0}
.srow .tg{margin-left:auto}
.tg{width:51px;height:31px;border-radius:16px;background:#e5e5ea;position:relative;flex:none;transition:background .2s}
.tg:after{content:'';position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px #0003;transition:left .2s}
.tg.on{background:#34c759}.tg.on:after{left:22px}
.profile-row{min-height:86px}.profile-row:before{display:none}
.profile-row .av{width:56px;height:56px;font-size:22px}
.profile-row b{font-size:20px;font-weight:600}.profile-row p{font-size:12.5px;color:#8e8e93;margin:2px 0 0}
.shero{text-align:center;padding:6px 0 20px}.shero .av{width:84px;height:84px;font-size:32px;margin:0 auto 10px}.shero h3{margin:0;font-size:22px;font-weight:500}
.srow input[type=range]{flex:1;accent-color:#007aff}
.srow .check{color:#007aff;margin-left:auto;font-weight:600}
.sfoot{font-size:12px;color:#8e8e93;margin:-10px 14px 18px}
.nobar .appbar{display:none}
.nobar .body{padding-bottom:96px}
.ltitle{font-size:32px;font-weight:700;margin:14px 2px 14px}
.spill{position:absolute;left:16px;right:16px;bottom:26px;height:46px;border-radius:23px;background:#ffffffd9;backdrop-filter:blur(18px);box-shadow:0 2px 14px #0002,inset 0 0 0 1px #ffffffaa;display:flex;align-items:center;gap:8px;padding:0 16px;z-index:5}
.spill svg{width:19px;height:19px;stroke:#3c3c43;flex:none}
.spill input{flex:1;border:0;background:none;outline:0;font:inherit;font-size:16px;min-width:0}
/* 열기/닫기 전환 */
.app-layer{position:absolute;inset:0;z-index:20;border-radius:inherit;overflow:hidden;background:var(--paper)}
.app-layer[hidden]{display:none}
.app-layer.open{animation:appOpen .44s cubic-bezier(.2,.9,.25,1)}
.app-layer.closing{animation:appClose .38s cubic-bezier(.4,0,.6,1) forwards}
.lockov{position:absolute;inset:0;z-index:40;border-radius:inherit;overflow:hidden;animation:unlockUp .33s cubic-bezier(.5,0,.8,.4) forwards;will-change:transform,opacity}
.lock.locking,.pin{animation:lockIn .3s ease-out}
.home.zoomin{animation:homeIn .45s cubic-bezier(.2,.9,.3,1)}
@keyframes appOpen{from{transform:scale(.14);opacity:.15;border-radius:90px}}
@keyframes appClose{to{transform:scale(.14);opacity:0;border-radius:90px}}
@keyframes unlockUp{to{transform:translateY(-100%);opacity:.4}}
@keyframes lockIn{from{opacity:0}}
@keyframes homeIn{from{transform:scale(1.1);opacity:.5}}
.clockview{--cbar:#1c1c1e;background:#000;color:#fff;padding-top:0}
.cbtns{position:absolute;top:54px;right:14px;display:flex;gap:10px;z-index:3}
.cpill,.cplus{height:38px;border-radius:19px;background:#2a2a2cdd;color:#fff;box-shadow:inset 0 0 0 1px #ffffff14,0 2px 10px #0006}
.cpill{padding:0 16px;font-size:15px;font-weight:500}
.cplus{width:38px;display:grid;place-items:center}.cplus svg{width:22px;height:22px;stroke:#fff;stroke-width:2}
.clockview .body{padding:100px 14px 100px}
.ctitle{font-size:30px;font-weight:700;margin:4px 0 12px;letter-spacing:-.3px}
.csec{font-size:17px;font-weight:700;margin:2px 0 6px}
.crow{display:flex;align-items:center;justify-content:space-between;border-top:1px solid #2c2c2e;min-height:86px;padding:6px 0}
.crow:last-child{border-bottom:1px solid #2c2c2e}
.csub{font-size:13px;color:#8e8e93}.ccity{font-size:24px;margin-top:2px;font-weight:500}
.ctime{font-size:52px;font-weight:200;letter-spacing:-1px;line-height:1.05;white-space:nowrap}
.ctime .ap{font-size:34px;font-weight:300;letter-spacing:0;margin-right:1px}
.crow.alarm{min-height:92px}.crow.alarm .ctime{font-weight:300}.crow.alarm .ctime .ap{font-size:46px}
.crow.alarm .csub{font-size:14px;margin-top:2px}
.crow.alarm.off .ctime,.crow.alarm.off .csub{color:#8e8e93}
.ctg{width:56px;height:26px;border-radius:13px;background:#39393d;position:relative;flex:none;cursor:pointer;transition:background .2s}
.ctg:after{content:'';position:absolute;top:2px;left:2px;width:35px;height:22px;border-radius:11px;background:#fff;transition:left .2s}
.ctg.on{background:#34c759}.ctg.on:after{left:19px}
.ctabs{position:absolute;left:20px;right:20px;bottom:19px;height:54px;border-radius:27px;background:#1c1c1ef2;box-shadow:inset 0 0 0 1px #ffffff1c,0 6px 22px #000a;display:flex;padding:3px;backdrop-filter:blur(18px)}
.ctabs button{--cbar:#1c1c1e;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;color:#fff;border-radius:24px}
.ctabs button.on{--cbar:#0a0a0b;color:#ff9f0a;background:#0a0a0b;flex:1.15}
.ctabs svg{width:24px;height:24px}
/* 음악 앱 */
.ytbox{position:absolute;z-index:25;overflow:hidden;border-radius:12px;background:#000;display:none}
.ytbox.on{display:block}.ytbox.hide{display:none}
.ytbox.pip{right:12px;bottom:150px;width:204px;height:115px;box-shadow:0 10px 30px #0000006b}
.yt-x{position:absolute;top:5px;right:5px;z-index:3;width:22px;height:22px;border-radius:50%;background:#000000a6;color:#fff;font-size:11px;display:grid;place-items:center;line-height:1}
.yt-fail{position:absolute;inset:0;z-index:2;background:#121212;color:#fff;display:flex;flex-direction:column;justify-content:center;gap:3px;padding:8px 30px 8px 10px;font-size:10px;line-height:1.35}
.yt-fail b{font-size:11.5px}.yt-fail span{opacity:.75}.yt-fail a{color:#ff5a6e;text-decoration:none;font-weight:600;margin-top:2px}
.ytbox iframe{width:100%;height:100%;border:0;display:block}
.mu{background:#fff;padding-top:54px}
.mubar{display:flex;align-items:center;justify-content:space-between;padding:4px 10px 6px}
.mubar button{color:#fa2d48;display:flex;align-items:center;gap:2px;font-size:16px;padding:6px}
.mubar svg{width:22px;height:22px}
.mu-sc{flex:1;overflow:auto;padding-bottom:150px}.mu-sc::-webkit-scrollbar{display:none}
.mu-pl{text-align:center;display:flex;flex-direction:column;align-items:center;padding-top:4px}
.mu-cover{width:210px;height:210px;border-radius:9px;box-shadow:0 12px 30px #0000003d;overflow:hidden}
.mu-pl h2{font-size:21px;font-weight:700;margin:14px 0 0}.mu-own{color:#fa2d48;font-size:19px}.mu-pl small{color:#8e8e93;font-size:12.5px;margin-top:3px}
.mu-btns{display:flex;gap:12px;padding:14px 18px 8px}
.mu-btns button{flex:1;height:44px;border-radius:11px;background:#f2f2f7;color:#fa2d48;font-weight:600;font-size:15.5px;display:flex;align-items:center;justify-content:center;gap:6px}
.mu-btns svg{width:18px;height:18px;fill:currentColor;stroke:none}
.cv{width:100%;height:100%;object-fit:cover;display:grid;place-items:center;color:#ffffffcc;font-size:44px}
.mu-tr{display:flex;align-items:center;gap:12px;padding:6px 8px 6px 18px;position:relative;width:100%;text-align:left}
.mu-tr .th{width:46px;height:46px;border-radius:6px;overflow:hidden;flex:none;position:relative}.mu-tr .cv{font-size:20px}
.mu-tr .tx{flex:1;min-width:0;border-bottom:.5px solid #e5e5ea;padding:6px 0;line-height:1.3}
.mu-tr b{display:block;font-size:15px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mu-tr .tx span{font-size:12.5px;color:#8e8e93}
.mu-tr.cur b{color:#fa2d48}
.mu-tr .eq{position:absolute;inset:0;background:#00000073;display:flex;align-items:flex-end;justify-content:center;gap:2px;padding-bottom:12px}
.mu-tr .eq i{width:3px;background:#fff;border-radius:2px;animation:eq .9s ease-in-out infinite alternate}
.mu-tr .eq i:nth-child(2){animation-delay:.25s}.mu-tr .eq i:nth-child(3){animation-delay:.5s}
@keyframes eq{from{height:5px}to{height:16px}}
.mu-tr .mo{color:#8e8e93;padding:6px}.mu-tr .mo svg{width:20px;height:20px}
.mu-foot{color:#8e8e93;font-size:12.5px;padding:12px 18px}
.m-mini{position:absolute;left:8px;right:8px;bottom:84px;height:56px;border-radius:15px;background:#f6f6f8f2;backdrop-filter:blur(16px);box-shadow:0 6px 22px #00000026;display:flex;align-items:center;gap:10px;padding:0 8px;z-index:4;text-align:left}
.m-mini .th{width:40px;height:40px;border-radius:7px;overflow:hidden;flex:none}.m-mini .cv{font-size:18px}
.m-mini .t{flex:1;font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-mini button{padding:6px}.m-mini svg{width:24px;height:24px;fill:#111;stroke:none}
.m-mini .pg{position:absolute;left:14px;right:14px;bottom:2px;height:2px;background:#0000001a;border-radius:2px;overflow:hidden}.m-mini .pg i{display:block;height:100%;background:#fa2d48}
.mutabs{position:absolute;left:0;right:0;bottom:0;height:78px;background:#f9f9fbee;backdrop-filter:blur(18px);border-top:.5px solid #d8d8dc;display:flex;padding:7px 4px 0;z-index:3}
.mutabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:#8e8e93;font-size:10px}
.mutabs button.on{color:#fa2d48}.mutabs svg{width:25px;height:25px}
.mu-now{background:#222;color:#fff;padding-top:0}
.np-bg{position:absolute;inset:-80px;background-size:cover;background-position:center;filter:blur(60px) saturate(1.7) brightness(.72);transform:scale(1.15)}
.np-glass{position:absolute;inset:0;background:#00000033}
.np{position:relative;flex:1;display:flex;flex-direction:column;padding:50px 24px 30px;height:100%}
.np-grab{width:40px;height:5px;border-radius:3px;background:#ffffff73;margin:4px auto 16px;flex:none;cursor:pointer}
.np-art{width:270px;height:270px;margin:12px auto 30px;border-radius:12px;overflow:hidden;box-shadow:0 20px 46px #0000006b;transition:transform .55s cubic-bezier(.3,1.4,.5,1);transform:scale(.8);flex:none}
.np-art.pop{transform:scale(1)}.np-art .cv{font-size:70px}
.np-art.yt{width:312px;height:176px;transform:none;background:#000;margin:44px -0px 50px;align-self:center;box-shadow:none}
.np-meta{display:flex;align-items:center;gap:10px}.np-meta>div{flex:1;min-width:0}
.np-meta b{display:block;font-size:20px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.np-meta span{font-size:18px;opacity:.62}
.np-meta button{width:30px;height:30px;border-radius:50%;background:#ffffff24;display:grid;place-items:center}.np-meta svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:1.8}
.np-prog{margin-top:20px;padding:8px 0;cursor:pointer}
.np-bar{height:7px;border-radius:4px;background:#ffffff40;overflow:hidden}.np-bar i{display:block;height:100%;background:#ffffffe0}
.np-times{display:flex;justify-content:space-between;font-size:11.5px;opacity:.6;margin-top:7px;font-variant-numeric:tabular-nums}
.np-ctl{display:flex;justify-content:space-around;align-items:center;margin:14px 0 22px}.np-ctl button{padding:6px}.np-ctl svg{fill:#fff;stroke:none}
.np-vol{display:flex;align-items:center;gap:10px;opacity:.78}.np-vol svg{width:18px;height:18px;fill:#fff;stroke:none;flex:none}.np-vol input{flex:1;accent-color:#fff}
.np-open{display:block;text-align:center;color:#fff;font-size:13px;background:#ffffff26;border-radius:14px;padding:6px 12px;margin:-24px auto 14px;width:max-content;text-decoration:none}
.np-foot{display:flex;justify-content:space-around;margin-top:auto;opacity:.78;padding-bottom:6px}.np-foot svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:1.7}
/* 사진 앱 */
.pho{background:#fff}
.pho .body{padding:0 0 100px}
.phh{padding:2px 16px 8px;display:flex;align-items:flex-end;justify-content:space-between}
.phh h1{font-size:30px;font-weight:700;margin:0}.phh small{color:#8e8e93;font-size:13px;padding-bottom:5px}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.pc{aspect-ratio:1;position:relative;overflow:hidden;background:#eee;cursor:pointer}
.pc img{width:100%;height:100%;object-fit:cover;display:block}
.pc .hv{position:absolute;left:5px;bottom:5px;width:16px;height:16px;fill:#fff;stroke:none;filter:drop-shadow(0 1px 2px #0006)}
.phtabs{position:absolute;left:46px;right:46px;bottom:19px;height:54px;border-radius:27px;background:#ffffffd9;backdrop-filter:blur(18px);box-shadow:inset 0 0 0 1px #00000012,0 6px 22px #00000026;display:flex;padding:3px;z-index:4}
.phtabs button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:10px;color:#3c3c43;border-radius:24px}
.phtabs button.on{background:#e9e9ee;color:#007aff}.phtabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.800}

  document.querySelectorAll('.clock').forEach(e => e.textContent = t);
  const dt = $('#lockDate'); if (dt) dt.textContent = `${d.getMonth()+1}월 ${d.getDate()}일 ${'일월화수목금토'[d.getDay()]}요일`;

};

function go(scene, app, iconEl, iconId){
  const from = state.scene;
  state.scene = scene; state.app = app || null; state.pin = ''; state.sub = null; state.cal = null; state.clockTab = null; state.ktTab = null; state.photoTab = null;
  if (scene === 'app') return openLayer(iconEl, iconId);
  if (from === 'app') { placeYT(); return closeLayer() }
  if (scene === 'home' && (from === 'lock' || from === 'pin')) return unlockTransition();
  placeYT();
  styleChrome(scene);
  ({ lock:renderLock, pin:renderPin, home:renderHome })[scene]();
  if (scene === 'lock' && from === 'home') $('#lockView').classList.add('locking');
  tick();
}

function unlockTransition(){
  const cur = base.firstElementChild, ov = document.createElement('div');
  ov.className = 'lockov'; ov.style.background = wallCss('lock') || 'var(--wall)';
  if (cur){ cur.style.transform = ''; cur.style.opacity = ''; ov.appendChild(cur) }
  screen.insertBefore(ov, appLayer);
  styleChrome('home'); renderHome(); placeYT();
  base.firstElementChild.classList.add('zoomin');
  setTimeout(() => { ov.remove(); base.firstElementChild?.classList.remove('zoomin') }, 460);
  tick();
}
/* 앱 열기: 누른 아이콘 위치에서 커지며 나타남 */
function openLayer(iconEl, iconId){
  clearTimeout(closeTimer);
  if (iconId) state.iconApp = iconId;
  styleChrome('app');
  root = appLayer; appLayer.hidden = false; appLayer.classList.remove('closing', 'open');
  appLayer.style.transformOrigin = iconEl ? iconCenter(iconEl) : '50% 50%';
  renderApp(); placeYT();
  void appLayer.offsetWidth; appLayer.classList.add('open');
  tick();
}
/* 앱 닫기: 아이콘 위치로 줄어들며 사라짐 */
function closeLayer(){

  const el = base.querySelector(`[data-app="${state.iconApp}"] .icon`);
  appLayer.style.transformOrigin = el ? iconCenter(el) : '50% 50%';
  appLayer.classList.remove('open'); appLayer.classList.add('closing');
  root = base;

function renderLock(){
  const n = CONFIG.lockNotice;
  root.innerHTML = `<div class="view lock" id="lockView">
    <div class="date" id="lockDate"></div><div class="time" id="lockTime"></div>
    ${n ? `<div class="notif"><b>${esc(n.title)}</b>${esc(n.text)}</div>` : ''}
    <div class="hint">위로 쓸어올리거나 눌러서 열기</div></div>`;
  const v = $('#lockView'); let st = null, moved = false;
  const k = () => screen.getBoundingClientRect().width / screen.offsetWidth || 1;
  v.onpointerdown = e => { st = { y: e.clientY }; moved = false; v.setPointerCapture?.(e.pointerId) };
  v.onpointermove = e => {            // 손가락을 따라 올라가며 흐려짐
    if (!st) return;
    const dy = Math.min(0, (e.clientY - st.y) / k());
    if (dy < -4) moved = true;
    v.style.transform = `translateY(${dy * .6}px)`; v.style.opacity = 1 + dy / 600;
  };
  v.onpointerup = e => {
    if (!st) return;
    const dy = (e.clientY - st.y) / k(); st = null;
    v.style.transform = ''; v.style.opacity = '';
    if (dy < -70 || !moved) unlock();   // 70px 이상 쓸어올리거나, 그냥 눌러도 열림
  };
  v.onpointercancel = () => { st = null; v.style.transform = ''; v.style.opacity = '' };
}

    <div class="keys">${[['1',''],['2','ABC'],['3','DEF'],['4','GHI'],['5','JKL'],['6','MNO'],['7','PQRS'],['8','TUV'],['9','WXYZ']]
      .map(([k,s])=>`<button data-k="${k}">${k}<small>${s}</small></button>`).join('')}
      <button class="t" data-k="x">취소</button><button data-k="0">0</button><button class="t" data-k="d">삭제</button></div></div>`;
  root.querySelectorAll('.keys button').forEach(b => b.onclick = () => key(b.dataset.k));

function key(k){
  if (k === 'x') return go('lock');
  if (k === 'd') state.pin = state.pin.slice(0,-1);
  else if (state.pin.length < CONFIG.passcode.length) state.pin += k;
  [...$('#dots').children].forEach((d,i) => d.classList.toggle('on', i < state.pin.length));
  if (state.pin.length === CONFIG.passcode.length){
    if (state.pin === CONFIG.passcode) setTimeout(() => go('home'), 150);
    else { $('#dots').classList.add('shake'); setTimeout(() => { state.pin=''; renderPin() }, 400) }
  }

const WX = {

};
const wxInfo = c => WX[c] || ['--', 'cloud'];
const CLOUD = '<path d="M7 18.500a4 4 0 0 1-.6-7.950A5.500 5.500 0 0 1 17 9.500a4.500 4.500 0 0 1 .5 9z" fill="#fff"/>';
const wxIcon = (kind, day = 1) => {
  const sun = '<circle cx="12" cy="12" r="4.500" fill="#ffd60a"/><g stroke="#ffd60a" stroke-width="1.800" stroke-linecap="round"><path d="M12 2.500v2.200M12 19.300v2.200M2.500 12h2.200M19.300 12h2.200M5.300 5.300l1.500 1.500M17.200 17.200l1.500 1.500M18.700 5.300l-1.500 1.500M6.800 17.200l-1.500 1.500"/></g>';
  const moon = '<path d="M19 14.500A7.500 7.500 0 1 1 9.500 5a6 6 0 0 0 9.500 9.500z" fill="#f3f0d8"/>';
  const g = {
    clear: day ? sun : moon,
    partly: (day ? '<g transform="translate(-3 -4) scale(.85)">' + sun + '</g>' : '<g transform="translate(-3 -4) scale(.85)">' + moon + '</g>') + '<g transform="translate(3 3)">' + CLOUD + '</g>',
    cloud: CLOUD.replace('fill="#fff"', 'fill="#e9eef5"'),
    fog: CLOUD + '<g stroke="#fff" stroke-width="1.600" stroke-linecap="round"><path d="M5 21h14M8 23.500h9"/></g>',
    rain: '<g transform="translate(0 -3)">' + CLOUD + '</g><g stroke="#7fc8ff" stroke-width="1.800" stroke-linecap="round"><path d="M8 18.500l-1 3M12 18.500l-1 3M16 18.500l-1 3"/></g>',
    snow: '<g transform="translate(0 -3)">' + CLOUD + '</g><g fill="#fff"><circle cx="8" cy="20" r="1.300"/><circle cx="12" cy="21.500" r="1.300"/><circle cx="16" cy="20" r="1.300"/></g>',
    thunder: '<g transform="translate(0 -3)">' + CLOUD.replace('fill="#fff"', 'fill="#cfd6df"') + '</g><path d="M12.500 14l-3 5h2.500l-1 4 4.500-6h-2.500l1-3z" fill="#ffd60a"/>',
  };
  return `<svg viewBox="0 0 24 24">${g[kind] || g.cloud}</svg>`;
};
const wxTheme = (kind, day) => !day ? 'linear-gradient(160deg,#1b2a4a,#3b4f78)'
  : kind === 'clear' ? 'linear-gradient(160deg,#3a8dde,#6cb6f5)' : kind === 'partly' ? 'linear-gradient(160deg,#4a8fd6,#7fb2dd)'
  : kind === 'rain' || kind === 'thunder' ? 'linear-gradient(160deg,#4c5d77,#6c7f99)' : kind === 'snow' ? 'linear-gradient(160deg,#7d93ad,#a9bccd)' : 'linear-gradient(160deg,#6b7f98,#93a5b8)';
function wxHTML(d){
  const w = CONFIG.weather, arrow = '<svg viewBox="0 0 24 24"><path d="M3 11 21 3l-8 18-2-8z"/></svg>';
  if (!d) return `<div class="wx" data-wx style="background:${wxTheme('clear', 1)}"><div class="wx-city">${esc(w.city)} ${arrow}</div><div class="wx-temp">--°</div></div>`;
  const [label, kind] = wxInfo(d.code);
  return `<div class="wx" data-wx style="background:${wxTheme(kind, d.day)}"><div class="wx-city">${esc(w.city)} ${arrow}</div><div class="wx-temp">${d.t}°</div>
    <div class="wx-ic">${wxIcon(kind, d.day)}</div><div class="wx-cond">${label}</div><div class="wx-hl">최고:${d.hi}° 최저:${d.lo}°</div></div>`;

let wxBusy = false;
async function loadWeather(){
  const w = CONFIG.weather, c = store.get('wx', null);
  if (wxBusy || (c && Date.now() - c.at < 10 * 60000)) return;
  wxBusy = true;
  try {
    const u = `https://api.open-meteo.com/v1/forecast?latitude=${w.lat}&longitude=${w.lon}&current=temperature_2m,weather_code,is_day&daily=temperature_2m_max,temperature_2m_min&timezone=${encodeURIComponent(w.tz)}&forecast_days=1`;
    const j = await (await fetch(u)).json(), R = Math.round;
    store.set('wx', { at: Date.now(), t: R(j.current.temperature_2m), code: j.current.weather_code, day: j.current.is_day, hi: R(j.daily.temperature_2m_max[0]), lo: R(j.daily.temperature_2m_min[0]) });
    const el = document.querySelector('[data-wx]'); if (el) el.outerHTML = wxHTML(store.get('wx', null));
  } catch (e) { /* 실패하면 이전에 받은 값(또는 --°)을 그대로 둔다 */ }
  wxBusy = false;
}

    <div class="pdots" id="pdots">${PAGES.map((_, i) => `<i data-p="${i}"></i>`).join('')}</div>
    <div class="dock">${DOCK.map(icon).join('')}</div></div>`;
  const pages = $('#pages'), dots = [...$('#pdots').children];

    state.page = Math.max(0, Math.min(PAGES.length - 1, i));
    pages.style.transform = `translateX(calc(${-state.page * 100}% + ${dx}px))`;
    dots.forEach((el, k) => el.classList.toggle('on', k === state.page));
  };
  show(state.page || 0);
  dots.forEach(el => el.onclick = () => show(+el.dataset.p));
  let x0 = null, moved = false;
  pages.onpointerdown = e => { x0 = e.clientX; moved = false };
  pages.onpointermove = e => {
    if (x0 === null) return;
    const dx = e.clientX - x0;
    if (Math.abs(dx) > 8) { moved = true; pages.classList.add('drag') }
    if (moved) show(state.page, dx * screen.offsetWidth / screen.getBoundingClientRect().width);
  };
  const end = e => {
    if (x0 === null) return;
    const dx = e.clientX - x0; x0 = null; pages.classList.remove('drag');

  };
  pages.onpointerup = end; pages.onpointerleave = end;
  pages.addEventListener('click', e => { if (moved) { e.stopPropagation(); e.preventDefault(); moved = false } }, true);

    const a = [...APPS, ...DOCK].find(x => x.id === b.dataset.app);

  });
}

const tzParts = (tz, d = new Date()) => Object.fromEntries(new Intl.DateTimeFormat('en-US', { timeZone: tz, hourCycle:'h23', year:'numeric', month:'numeric', day:'numeric', hour:'numeric', minute:'numeric', second:'numeric' }).formatToParts(d).filter(x => x.type !== 'literal').map(x => [x.type, +x.value]));

  const base = tzParts('Asia/Seoul');

    const p = tzParts(c.tz), diff = Math.round((asUTC(p) - asUTC(base)) / 3600000);
    const dayDiff = Math.round((Date.UTC(p.year, p.month-1, p.day) - Date.UTC(base.year, base.month-1, base.day)) / 86400000);
    const day = dayDiff < 0 ? '어제' : dayDiff > 0 ? '내일' : '오늘';
    return `<div class="crow"><div><div class="csub">${day}, ${diff >= 0 ? '+' : ''}${diff}시간</div><div class="ccity">${esc(c.city)}</div></div><div class="ctime"><span class="ap">${apm(p.hour)}</span>${h12(p.hour)}:${pad(p.minute)}</div></div>`;

function goBack(){

const PERSON = '<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4.200"/><path d="M3.500 24c0-6 4-9 8.500-9s8.500 3 8.500 9z"/></svg>';
const msgKey = i => 'chat-' + CONFIG.messages[i].name;
const msgTalk = i => [...CONFIG.messages[i].chat, ...store.get(msgKey(i), [])];
const msgLast = i => [...msgTalk(i)].reverse().find(x => x[0] !== 'time');
const msgUnread = i => { const l = msgLast(i); return !!l && l[0] === 'them' && !(store.get('imread', {})[CONFIG.messages[i].name]) };
const unreadCount = () => CONFIG.messages.reduce((n, _, i) => n + (msgUnread(i) ? 1 : 0), 0);
function messages(){
  const SEARCH = '<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.500"/><path d="m16 16 4.500 4.500"/></svg>';

        const html = `<div class="imtm">${first ? 'iMessage<br>' : ''}${hasDay ? `<b>${esc(day)}</b> ${esc(rest)}` : `<b>${esc(t)}</b>`}</div>`; first = false; return html;

    }).join('');
    root.innerHTML = `<div class="view appview im"><div class="imth"><button class="imgl" id="back" aria-label="뒤로"><svg viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></svg></button>
        <div class="imwho"><span class="imav">${PERSON}</span><span>${esc(m.name)} <svg class="chv" viewBox="0 0 8 12"><path d="m1.500 1.500 5 4.500-5 4.500"/></svg></span></div>

      store.set(msgKey(i), [...store.get(msgKey(i), []), ['me', v]]); renderApp(); $('#back').onclick = goBack; $('#ci').focus() };

  }
  root.innerHTML = `<div class="view appview im"><div class="imh"><button class="imgl">편집</button><button class="imgl" aria-label="새 메시지"><svg viewBox="0 0 24 24"><path d="M4 20h4L19.500 8.500a2.800 2.800 0 0 0-4-4L4 16z"/><path d="m13.500 6.500 4 4"/></svg></button></div>
    <div class="imsc"><h1>메시지</h1><div class="imsearch">${SEARCH}<span>검색</span></div>
      ${CONFIG.messages.map((m, i) => {
        const last = msgLast(i), when = [...msgTalk(i)].reverse().find(x => x[0] === 'time');
        const label = when ? (when[1].startsWith('오늘 ') ? when[1].slice(3) : when[1].split(' ')[0]) : '';
        return `<button class="imrow" data-i="${i}">${msgUnread(i) ? '<span class="dot"></span>' : ''}<span class="imav">${PERSON}</span><span class="tx"><span class="l1"><b>${esc(m.name)}</b><span class="tm">${esc(label)}</span><svg class="cv2" viewBox="0 0 8 12"><path d="m1.500 1.500 5 4.500-5 4.500"/></svg></span><p>${esc(last ? last[1] : '')}</p></span></button>`;
      }).join('')}</div></div>`;
  root.querySelectorAll('[data-i]').forEach(b => b.onclick = () => { state.sub = +b.dataset.i; renderApp(); $('#back').onclick = goBack });
}
function refreshBadges(){

  if (!n){ el?.remove() } else { if (!el){ el = document.createElement('span'); el.className = 'badge'; b.appendChild(el) } el.textContent = n }

const HEART = '<svg viewBox="0 0 24 24"><path d="M12 20.500S3.500 15.200 3.500 9.200A4.700 4.700 0 0 1 12 6.800a4.700 4.700 0 0 1 8.500 2.400c0 6-8.500 11.300-8.500 11.300z"/></svg>';
function photos(){

/* 캘린더 앱 */
const parseYMD = d => { const [y, m, dd] = d.split('-').map(Number); return new Date(y, m - 1, dd) };
const addDays = (d, n) => { const x = parseYMD(d); x.setDate(x.getDate() + n); return ymd(x) };
const dateLong = d => { const x = parseYMD(d); return `${x.getMonth() + 1}월 ${x.getDate()}일 ${'일월화수목금토'[x.getDay()]}요일` };
const ampmT = t => { const [h, m] = t.split(':').map(Number); return `${h < 12 ? '오전' : '오후'} ${h12(h)}:${pad(m)}` };
const evOn = d => CONFIG.events.filter(e => e.yearly ? e.date === d.slice(5) : e.date === d)
  .map(e => ({ ...e, allDay: e.allDay ?? !e.start, color: e.color || '#ff3b30' }))
  .sort((a, b) => (b.allDay ? 1 : 0) - (a.allDay ? 1 : 0) || String(a.start || '').localeCompare(String(b.start || '')));
function calendar(){
  const today = ymd(new Date());
  const c = state.cal = state.cal || { view: 'month', sel: today, ym: today.slice(0, 7) };
  const keep = root.querySelector('.ca-sc')?.scrollTop || 0;
  const chevL = MI.chevL, chevR = chevL.replace('<svg', '<svg style="transform:scaleX(-1)"');
  const plus = MI.plus;
  let html;
  if (c.view === 'month'){
    const [y, m] = c.ym.split('-').map(Number), first = new Date(y, m - 1, 1).getDay(), days = new Date(y, m, 0).getDate();
    let cells = '<div class="ca-c" style="pointer-events:none"></div>'.repeat(first);
    for (let d = 1; d <= days; d++){
      const ds = `${y}-${pad(m)}-${pad(d)}`, dow = (first + d - 1) % 7;
      cells += `<div class="ca-c ${ds === today ? 'today' : ''} ${ds === c.sel ? 'sel' : ''} ${dow === 0 || dow === 6 ? 'we' : ''}" data-d="${ds}"><span>${d}</span><div class="ca-dots">${evOn(ds).slice(0, 3).map(e => `<i style="background:${esc(e.color)}"></i>`).join('')}</div></div>`;
    }
    const list = evOn(c.sel);
    html = `<div class="view appview ca"><div class="ca-hd"><div class="ca-nav"><button class="ca-lk" data-a="prev">${chevL}<span>${m === 1 ? y - 1 : y}년</span></button>
        <div class="ca-seg"><button class="on">월</button><button data-a="day">일</button></div><div style="display:flex"><button class="ca-ic" data-a="next" aria-label="다음 달">${chevR}</button><button class="ca-ic" data-a="add" aria-label="일정 추가">${plus}</button></div></div>
        <h1 class="ca-t">${m}월 <small>${y}</small></h1><div class="ca-dow">${CAL_DOW.map(d => `<span>${d}</span>`).join('')}</div></div>
      <div class="ca-sc"><div class="ca-grid">${cells}</div><div class="ca-sel"><div class="ca-sh">${dateLong(c.sel)}${c.sel === today ? ' <b>오늘</b>' : ''}</div>
        ${list.map(e => `<div class="ca-ev" style="--c:${esc(e.color)}"><i></i><div><b>${esc(e.title)}</b>${e.loc ? `<span>${esc(e.loc)}</span>` : ''}</div><small>${e.allDay ? '하루 종일' : `${ampmT(e.start)}<br>${ampmT(e.end || e.start)}`}</small></div>`).join('') || '<div class="ca-none">일정 없음</div>'}
        <button class="ca-add" data-a="add">${plus} 일정 추가</button></div></div>
      <nav class="ca-tb"><button data-a="today">오늘</button><button>캘린더</button><button>받은 참석 요청</button></nav></div>`;
  } else {
    const d0 = parseYMD(c.sel), start = addDays(c.sel, -d0.getDay()), week = Array.from({ length: 7 }, (_, i) => addDays(start, i));
    const evs = evOn(c.sel), all = evs.filter(e => e.allDay), timed = evs.filter(e => !e.allDay), H = 48;
    const n = new Date(), nowMin = n.getHours() * 60 + n.getMinutes();
    const hourLabel = h => h === 0 ? '' : h < 12 ? `오전 ${h}시` : h === 12 ? '정오' : `오후 ${h - 12}시`;
    html = `<div class="view appview ca"><div class="ca-hd"><div class="ca-nav"><button class="ca-lk" data-a="month">${chevL}<span>${d0.getMonth() + 1}월</span></button>
        <div class="ca-seg"><button data-a="month">월</button><button class="on">일</button></div><button class="ca-ic" data-a="add" aria-label="일정 추가">${plus}</button></div>
        <div class="ca-week">${week.map(w => { const wd = parseYMD(w); return `<div class="${w === c.sel ? 'sel' : ''} ${w === today ? 'today' : ''}" data-d="${w}"><small>${CAL_DOW[wd.getDay()]}</small><span>${wd.getDate()}</span></div>` }).join('')}</div>
        <div class="ca-dt">${dateLong(c.sel)}</div>${all.length ? `<div class="ca-all">${all.map(e => `<div style="--c:${esc(e.color)}">${esc(e.title)}</div>`).join('')}</div>` : ''}</div>
      <div class="ca-sc ca-tl" id="caTL"><div class="ca-hours" style="height:${24 * H}px">
        ${Array.from({ length: 24 }, (_, h) => `<div class="ca-hr" style="top:${h * H}px"><span>${hourLabel(h)}</span></div>`).join('')}
        ${timed.map(e => { const [sh, sm] = e.start.split(':').map(Number), [eh, em] = (e.end || e.start).split(':').map(Number); const top = (sh * 60 + sm) / 60 * H, ht = Math.max(22, ((eh * 60 + em) - (sh * 60 + sm)) / 60 * H); return `<div class="ca-blk" style="top:${top}px;height:${ht}px;--c:${esc(e.color)}"><b>${esc(e.title)}</b><span>${ampmT(e.start)}${e.loc ? ' · ' + esc(e.loc) : ''}</span></div>` }).join('')}
        ${c.sel === today ? `<div class="ca-now" style="top:${nowMin / 60 * H}px"><span>${n.getHours()}:${pad(n.getMinutes())}</span></div>` : ''}</div></div></div>`;
  }
  root.innerHTML = html;
  const sc = root.querySelector('.ca-sc'); if (sc) sc.scrollTop = c.view === 'day' && !c.dayInit ? (c.dayInit = 1, 7 * 48) : keep;
  if (c.view === 'month') c.dayInit = 0;
  const again = () => calendar();
  root.querySelectorAll('[data-d]').forEach(el => el.onclick = () => { c.sel = el.dataset.d; again() });
  root.querySelectorAll('[data-a]').forEach(el => el.onclick = () => {
    const a = el.dataset.a;
    const move = k => { const [y, m] = c.ym.split('-').map(Number), d = new Date(y, m - 1 + k, 1); c.ym = `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; c.sel = `${c.ym}-01`; c.dayInit = 0; sc && (sc.scrollTop = 0); calendar(); root.querySelector('.ca-sc').scrollTop = 0 };
    if (a === 'prev') move(-1); else if (a === 'next') move(1);
    else if (a === 'today'){ c.sel = today; c.ym = today.slice(0, 7); calendar() }
    else if (a === 'day'){ c.view = 'day'; c.dayInit = 0; calendar() }
    else if (a === 'month'){ c.view = 'month'; c.ym = c.sel.slice(0, 7); calendar() }
  });
}
const CAL_DOW = ['일', '월', '화', '수', '목', '금', '토'];
function contacts(){
  root.innerHTML = shell('연락처', `<div class="body">${CONFIG.contacts.map(c =>
    `<a class="row" style="text-decoration:none;color:inherit" href="tel:${esc(c.phone)}"><span class="av">${esc(c.name[0])}</span><span class="t"><b>${esc(c.name)}</b><p>${esc(c.phone)}</p></span></a>`).join('')}</div>`);
}

/* home indicator: tap or swipe-up → home / lock */
const hb = $('#homebar'); let hbY = null, hbSwiped = false;
hb.onpointerdown = e => { hbY = e.clientY; hbSwiped = false };
hb.onpointerup = e => { if (hbY !== null && hbY - e.clientY > 12 && state.scene === 'app'){ hbSwiped = true; go('home') } hbY = null };
hb.onclick = () => {                        // 탭: 홈 ↔ 잠금 (비밀번호 입력 중에는 무시)
  if (hbSwiped){ hbSwiped = false; return }
  if (state.scene === 'app') go('home'); else if (state.scene === 'home') go('lock');
};
let sy = null;
screen.addEventListener('pointerdown', e => sy = e.clientY);
screen.addEventListener('pointerup', e => {
  if (sy !== null && sy - e.clientY > 90 && sy > screen.getBoundingClientRect().bottom - 60 && state.scene === 'app') go('home');
  sy = null;
});

function fit(){ const d=$('.device'); d.style.zoom = innerWidth>760 ? Math.min(1,(innerHeight-40)/796) : 1 }
addEventListener('resize', fit); fit();
document.title = CONFIG.owner;
go('lock');
</script>
